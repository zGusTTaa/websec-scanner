{% extends "base.html" %}
{% block title %}Detalhes do Scan — WebSec Scanner{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="/scans" class="back-link">← Voltar</a>
        <h1>Scan #<span id="scan-id-label">…</span></h1>
        <p class="subtitle" id="scan-meta">Carregando…</p>
    </div>
    <button class="btn btn-danger" onclick="deleteScan()">🗑 Remover Scan</button>
</div>

<div class="stats-grid" id="scan-stats">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="detail-total">—</div></div>
    <div class="stat-card critical"><div class="stat-label">Críticos</div><div class="stat-value" id="detail-critical">—</div></div>
    <div class="stat-card high"><div class="stat-label">Altos</div><div class="stat-value" id="detail-high">—</div></div>
    <div class="stat-card medium"><div class="stat-label">Médios</div><div class="stat-value" id="detail-medium">—</div></div>
</div>

<section class="section">
    <h2>Findings</h2>
    <div id="findings-list">
        <p class="muted">Carregando…</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>window.SCAN_ID = {{ scan_id }};</script>
<script src="/static/js/scan_detail.js"></script>
{% endblock %}
